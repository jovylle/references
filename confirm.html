<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Reference</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell narrow">
      <section class="panel hero">
        <p class="eyebrow">Confirm reference</p>
        <h1>Approve the request.</h1>
        <p class="lede">Sign in, review the request, then confirm it if it is correct.</p>
        <div class="auth-row">
          <button id="signInBtn" class="button button-primary">Continue with Google</button>
          <button id="signOutBtn" class="button button-secondary hidden">Sign out</button>
        </div>
        <p id="authStatus" class="status">Not signed in.</p>
      </section>

      <section class="panel">
        <div id="requestState" class="stack">
          <p class="muted">Loading request...</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/confirm.js"></script>
  </body>
</html>
