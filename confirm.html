<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Reference</title>
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body>
    <main class="shell narrow">
      <section class="panel hero">
        <div class="hero-main-layout">
          <div>
            <p class="eyebrow">Confirm a reference</p>
            <h1>Does this look right?</h1>
            <p class="lede">Review the details below. Sign in when you’re ready to confirm.</p>
          </div>
        </div>
      </section>

      <section class="panel">
        <div id="requestState" class="stack">
          <p class="muted">Loading request...</p>
        </div>
      </section>

      <section class="panel hidden" id="reciprocalSection">
        <h2 style="margin-top: 0; font-size: 1.3rem;">Add them to your profile too? (optional)</h2>
        <p style="color: var(--muted); margin: 12px 0 20px;">
          If you also want them listed on your public profile, add a short line about their role or how you worked together.
        </p>
        <form id="reciprocalForm" class="form">
          <label>
            Their role or how you know them
            <input id="reciprocalPosition" type="text" placeholder="e.g. Backend dev on our team" maxlength="120" />
          </label>
          <button type="submit" class="button button-secondary">Add to my profile</button>
          <button type="button" id="skipReciprocal" class="button button-secondary">Skip</button>
        </form>
      </section>

      <footer id="confirmFooter" class="home-footer"></footer>
    </main>

    <script type="module" src="/src/confirm.js?v=12"></script>
  </body>
</html>
